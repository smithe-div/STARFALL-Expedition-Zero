
name: STARFALL Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Check Android export preset
        run: |
          test -f export_presets.cfg || {
            echo "Missing export_presets.cfg"
            echo "Create an Android preset in Godot first."
            exit 1
          }

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/STARFALL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STARFALL-Android-APK
          path: build/STARFALL.apk
          if-no-files-found: error
          retention-days: 7
          
